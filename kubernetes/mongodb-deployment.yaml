apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: kubepulse
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6
        args:
        - "--bind_ip_all"
        - "--replSet"
        - "rs0"
        - "--journal"
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_DATABASE
          value: kubepulse
        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                PRIMARY_HOST="mongodb-0.mongodb.kubepulse.svc.cluster.local:27017"
                SELF_HOST="$(hostname -f):27017"

                # Wait for this container's mongod instance to start accepting connections
                until mongosh --host localhost --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; do
                  sleep 2
                done

                if [ "$SELF_HOST" = "$PRIMARY_HOST" ]; then
                  mongosh --quiet --eval 'try { rs.status(); } catch (err) { if (err.codeName === "NotYetInitialized") { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb-0.mongodb.kubepulse.svc.cluster.local:27017" }] }); } }' || true
                else
                  until mongosh --host "$PRIMARY_HOST" --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; do
                    sleep 5
                  done
                  mongosh --host "$PRIMARY_HOST" --quiet --eval "try { rs.add(\"$SELF_HOST\"); } catch (err) { if (!(err.message && err.message.indexOf('already') !== -1)) { throw err; } }" || true
                fi
  volumeClaimTemplates:
  - metadata:
      name: mongodb-storage
    spec:
      accessModes: 
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: kubepulse
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
  clusterIP: None
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-external
  namespace: kubepulse
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
  type: ClusterIP
